/* ── 토큰 ──
   Supabase 토큰은 한 시간이면 만료된다.
   갱신이 없으면 로그인 한 시간 뒤부터 저장이 조용히 실패한다. */
const SESS_PAD = 60 * 1000; // 만료 1분 전에 미리 갱신
const sessOf = t => t?.access_token ? {
  token: t.access_token,
  refresh: t.refresh_token,
  at: Date.now(),
  exp: Date.now() + (Number(t.expires_in) || 3600) * 1000
} : null;
/* exp 가 없는 옛 세션은 55분으로 본다 */
const sessExp = s => Number(s?.exp) || (Number(s?.at) || 0) + 55 * 60 * 1000;
const sessAlive = s => !!s?.token && Date.now() < sessExp(s) - SESS_PAD;
const sbRefresh = rt => sbFetch("/auth/v1/token?grant_type=refresh_token", {
  method: "POST",
  body: JSON.stringify({
    refresh_token: rt
  })
});

/* 쓸 수 있는 토큰을 준다. 만료됐으면 조용히 새로 받는다.
   새로 받으면 onNew(세션) 으로 알려 저장하게 한다.
   여러 곳에서 동시에 불러도 갱신은 한 번만 (REFRESHING) */
let REFRESHING = null;
async function sbToken(sess, onNew) {
  if (!sess?.token) return null;
  if (sessAlive(sess)) return sess.token;
  if (!sess.refresh) return null;
  if (!REFRESHING) {
    REFRESHING = sbRefresh(sess.refresh).then(sessOf);
  }
  let n = null;
  try {
    n = await REFRESHING;
  } catch (e) {
    n = null;
  }
  REFRESHING = null;
  if (!n?.token) return null;
  if (onNew) onNew(n);
  return n.token;
}

/* ── 기념사진 (Storage) ──
   사진은 base64 로 기록 안에 들어간다. 한 장에 85KB.
   폰 저장칸(localStorage)은 보통 5MB 라, 60장이면 앱이 저장을 못 한다.
   그래서 서버 Storage 로 옮기고 기록에는 주소만 남긴다.

   ★ 사진칸은 공개(public)로 만든다. 주소를 알아야만 볼 수 있고,
     주소에 아무도 못 맞히는 번호가 들어간다.
     비공개로 하면 볼 때마다 열쇠를 새로 받아야 하고,
     그 열쇠가 만료되면 스코어카드 그림에서 사진이 빠진다. */
const PHOTO_BUCKET = "score-photos";
const isDataUrl = s => typeof s === "string" && s.startsWith("data:");

/* base64 를 실제 파일 덩어리로 */
function dataUrlToBlob(u) {
  const [head, b64] = String(u).split(",");
  const type = (head.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {
    type
  });
}

/* 사진 한 장 올리고 주소를 돌려준다 */
async function pushPhoto(dataUrl, token, me, gameId) {
  const blob = dataUrlToBlob(dataUrl);
  const ext = blob.type === "image/png" ? "png" : "jpg";
  const path = `${me}/${gameId}.${ext}`;
  const res = await fetch(`${SB_URL}/storage/v1/object/${PHOTO_BUCKET}/${path}`, {
    method: "POST",
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${token}`,
      "Content-Type": blob.type,
      "x-upsert": "true" // 다시 올리면 덮어쓴다
    },
    body: blob
  });
  if (!res.ok) {
    let m = `오류 ${res.status}`;
    try {
      const b = await res.json();
      m = b?.message || b?.error || m;
    } catch (e) {}
    throw new Error(m);
  }
  return `${SB_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${path}`;
}

/* 별명 규칙 — 지어도 되는 이름인지 (지역은 자유) */
function nickBad(s) {

/* 서버 오류를 사람 말로 */
function syncMsg(e) {
  const m = String(e?.message || e || "");
  if (/JWT|token|expired|401/i.test(m)) return "로그인이 만료됐습니다. 다시 로그인해 주세요";
  if (/row-level security|policy|42501|permission/i.test(m)) return "서버가 저장을 막고 있습니다 (권한 설정 확인 필요)";
  if (/column|PGRST|does not exist|42703/i.test(m)) return "서버 표 모양이 앱과 다릅니다 (" + m.slice(0, 60) + ")";
  if (/fetch|network|Failed/i.test(m)) return "인터넷이 끊겼습니다. 나중에 저절로 올라갑니다";
  return m.slice(0, 80) || "올리지 못했습니다";

/* ══ 골프 스코어카드 ═══════════════════════════
   스코어 입력만 전체화면 가로, 나머지는 세로.
   파는 홀마다 직접 넣는다 (골프장마다 다르니까).
   ══════════════════════════════════════════ */

/* 기본 파 배치 — 홀마다 눌러 고칠 수 있으니 어디까지나 출발점이다 */
const PAR18 = [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 3, 5, 4, 4, 4, 3, 5, 4]; // 골프 · 합계 72
const PARK9 = [4, 3, 4, 3, 5, 4, 3, 4, 3]; // 파크골프 · 합계 33
/* ★ 파크골프는 6홀·12홀·15홀인 곳이 있어 홀 수가 18을 넘지 않는 선에서 제각각이다.
      모자라면 기본 배치를 되풀이해 채운다 */
const parsFor = (holes, sport) => {
  const base = sport === "parkgolf" ? [...PARK9, ...PARK9] : PAR18;
  const n = Math.max(1, Math.min(18, Number(holes) || 18));
  const out = [];
  for (let i = 0; i < n; i++) out.push(base[i % base.length]);
  return out;
};

/* 파 대비 이름과 색 */
function golfName(s, par) {
  if (!s || !par) return {
    t: "",
    c: "var(--chalk)"
  };
  const d = s - par;
  if (d <= -3) return {
    t: "알바트로스",
    c: "#E8B838"
  };
  if (d === -2) return {
    t: "이글",
    c: "#E8B838"
  };
  if (d === -1) return {
    t: "버디",
    c: "#E8734A"
  };
  if (d === 0) return {
    t: "파",
    c: "var(--ivory)"
  };
  if (d === 1) return {
    t: "보기",
    c: "#5B9BD5"
  };
  if (d === 2) return {
    t: "더블보기",
    c: "#7B93A8"
  };
  return {
    t: `+${d}`,
    c: "#7B93A8"
  };
}

/* 홀별 결과를 이글·버디·파·보기·더블·트리플로 나눈다 */
function golfTally(card, pars) {
  const z = {
    eagle: 0,
    birdie: 0,
    par: 0,
    bogey: 0,
    dbl: 0,
    tpl: 0,
    holes: 0,
    sum: 0,
    parSum: 0
  };
  (card || []).forEach((v, i) => {
    const s = Number(v) || 0,
      p = Number((pars || [])[i]) || 0;
    if (!s || !p) return;
    z.holes++;
    z.sum += s;
    z.parSum += p;
    const d = s - p;
    if (d <= -2) z.eagle++;else if (d === -1) z.birdie++;else if (d === 0) z.par++;else if (d === 1) z.bogey++;else if (d === 2) z.dbl++;else z.tpl++;
  });
  return z;
}
const golfAdd = (a, b) => {
  const z = {};
  ["eagle", "birdie", "par", "bogey", "dbl", "tpl", "holes", "sum", "parSum"].forEach(k => {
    z[k] = (a[k] || 0) + (b[k] || 0);
  });
  return z;
};
const golfZero = () => ({
  eagle: 0,
  birdie: 0,
  par: 0,
  bogey: 0,
  dbl: 0,
  tpl: 0,
  holes: 0,
  sum: 0,
  parSum: 0
});
const golfDiff = z => z.holes ? z.sum - z.parSum : null;
const fmtDiff = d => d === null ? "" : d > 0 ? `+${d}` : d === 0 ? "E" : String(d);
const GCELL = 34;
const GNAME = 74; /* ★ 이름 + ▲▼ 자리 (전에는 52) */

/* ── 아홉 홀 ── */
/* ══ 스코어카드 사진 · 이미지로 내보내기 ═══════
   골프장에서 주는 종이 카드처럼, 왼쪽에 기념사진을 붙이고
   전체를 그림 한 장으로 만들어 폰에 저장하거나 톡으로 보낸다.
   ══════════════════════════════════════════ */

/* 사진을 줄여서 담는다 — 원본 그대로 두면 저장 공간이 금방 찬다 */
function shrinkPhoto(file, maxW = 1280, q = 0.72) {
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onerror = () => no(new Error("사진을 읽지 못했습니다"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => no(new Error("사진을 열지 못했습니다"));
      img.onload = () => {
        const r = Math.min(1, maxW / img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * r);
        c.height = Math.round(img.height * r);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* 스코어카드를 그림 한 장으로 그린다 */
/* 그림 크기 — 미리보기와 실제 그림이 같은 비율이어야 한다 */
const CARD_W = 1600,
  CARD_PW = 520;
const cardH = n => Math.max(540, 172 + (n + 1) * 78 + 104);

/* 사진을 어디에 얼마나 크게 놓을지.
   z 는 확대, x·y 는 밀어놓은 정도(그림 좌표). 자리가 비지 않게 붙잡는다 */
/* ★ 8판 — 100% 는 "칸을 꽉 채우는 크기" 다.
      전에는 그 아래로 못 내려가게 막아둬서, 가로로 긴 사진은 위아래가 잘린 채
      전체를 볼 방법이 없었다 ("축소가 안 된다" — 사용자 지적).
      이제 사진 전체가 다 보이는 크기까지 줄일 수 있다. 남는 자리는 카드 바탕색이다.
      photoMinZ 가 그 가장 작은 값이다 (세로로 긴 사진이면 1보다 작다) */
function photoMinZ(iw, ih, PW, H) {
  if (!iw || !ih) return 1;
  const cover = Math.max(PW / iw, H / ih);
  const fit = Math.min(PW / iw, H / ih);
  return cover ? fit / cover : 1;
}
function photoFit(iw, ih, PW, H, trim) {
  const t = trim || {
    z: 1,
    x: 0,
    y: 0
  };
  const base = Math.max(PW / iw, H / ih);
  const lo = photoMinZ(iw, ih, PW, H);
  const s = base * Math.min(3, Math.max(lo, Number(t.z) || 1));
  const dw = iw * s,
    dh = ih * s;
  const mx = Math.max(0, (dw - PW) / 2),
    my = Math.max(0, (dh - H) / 2);
  const x = Math.min(mx, Math.max(-mx, Number(t.x) || 0));
  const y = Math.min(my, Math.max(-my, Number(t.y) || 0));
  return {
    dw,
    dh,
    dx: (PW - dw) / 2 + x,
    dy: (H - dh) / 2 + y,
    mx,
    my
  };
}
function drawCard(o) {
  const {
    place,
    courseA,
    courseB,
    date,
    holes,
    pars,
    names,
    cards,
    photo,
    trim,
    memo
  } = o;
  const W = CARD_W;
  const H = cardH(names.length);
  const rowH = 78;
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#0B1520";
  x.fillRect(0, 0, W, H);

  /* 왼쪽 사진 */
  const PW = photo ? CARD_PW : 0;
  const drawRest = () => {
    const L = PW ? PW + 34 : 40;
    const RW = W - L - 40;
    x.fillStyle = "#4FB286";
    x.font = "700 40px 'IBM Plex Sans KR', sans-serif";
    x.fillText(place || "골프장", L, 72);
    x.fillStyle = "#9FBBD0";
    x.font = "400 24px 'IBM Plex Sans KR', sans-serif";
    const sub = [date, [courseA, courseB].filter(Boolean).join(" · "), `${holes}홀 · 파 ${pars.slice(0, holes).reduce((t, v) => t + (Number(v) || 0), 0)}`].filter(Boolean).join("   ");
    x.fillText(sub, L, 110);

    /* ★ 8판 — 오른쪽 위가 통째로 비어 있었다. 마음대로 적는 문구를 넣는다.
          모임 이름 · 회차 · 총무 등. 안 적으면 예전 그대로 빈칸이다.
          ★ 길면 글씨를 줄여 카드 폭을 안 넘게 한다 */
    const memoLines = (Array.isArray(memo) ? memo : [memo]).map(t => String(t || "").trim()).filter(Boolean).slice(0, 2);
    if (memoLines.length) {
      const RX = W - 40; // 오른쪽 끝
      const roomL = L + 560; // 왼쪽 제목과 겹치지 않게
      const fit = (t, want, weight) => {
        let s = want;
        for (; s > 15; s -= 1) {
          x.font = `${weight} ${s}px 'IBM Plex Sans KR', sans-serif`;
          if (x.measureText(t).width <= RX - roomL) break;
        }
        return s;
      };
      x.textAlign = "right";
      const s1 = fit(memoLines[0], 34, 700);
      x.fillStyle = "#E8B838";
      x.font = `700 ${s1}px 'IBM Plex Sans KR', sans-serif`;
      x.fillText(memoLines[0], RX, 68);
      if (memoLines[1]) {
        const s2 = fit(memoLines[1], 24, 400);
        x.fillStyle = "#9FBBD0";
        x.font = `400 ${s2}px 'IBM Plex Sans KR', sans-serif`;
        x.fillText(memoLines[1], RX, 68 + s1 + 8);
      }
      x.textAlign = "left";
    }
    const nameW = 150,
      totW = 96;
    const cellW = Math.floor((RW - nameW - totW * (holes > 9 ? 3 : 2)) / holes);
    let top = 152;
    const put = (t, cx, cy, col, size, bold) => {
      x.fillStyle = col;
      x.textAlign = "center";
      x.font = `${bold ? 700 : 500} ${size}px 'Oswald', sans-serif`;
      x.fillText(String(t), cx, cy);
      x.textAlign = "left";
    };

    /* 머리 */
    let cx = L + nameW;
    for (let i = 0; i < holes; i++) {
      put(i + 1, cx + cellW / 2, top, "#7B93A8", 21);
      cx += cellW;
      if (i === 8 && holes > 9) {
        put("OUT", cx + totW / 2, top, "#4FB286", 19, 1);
        cx += totW;
      }
    }
    if (holes > 9) {
      put("IN", cx + totW / 2, top, "#4FB286", 19, 1);
      cx += totW;
    }
    put("합계", cx + totW / 2, top, "#4FB286", 19, 1);
    top += 16;
    const line = yy => {
      x.strokeStyle = "rgba(159,187,208,.18)";
      x.beginPath();
      x.moveTo(L, yy);
      x.lineTo(W - 40, yy);
      x.stroke();
    };

    /* 파 줄 */
    let y = top + rowH;
    x.fillStyle = "#E8B838";
    x.font = "700 26px 'IBM Plex Sans KR', sans-serif";
    x.fillText("파", L, y - rowH / 3);
    cx = L + nameW;
    let out = 0,
      inn = 0;
    for (let i = 0; i < holes; i++) {
      const p = Number(pars[i]) || 0;
      if (i < 9) out += p;else inn += p;
      put(p || "-", cx + cellW / 2, y - rowH / 3, "#E8B838", 30, 1);
      cx += cellW;
      if (i === 8 && holes > 9) {
        put(out, cx + totW / 2, y - rowH / 3, "#E8B838", 30, 1);
        cx += totW;
      }
    }
    if (holes > 9) {
      put(inn, cx + totW / 2, y - rowH / 3, "#E8B838", 30, 1);
      cx += totW;
    }
    put(out + inn, cx + totW / 2, y - rowH / 3, "#E8B838", 30, 1);
    line(y);

    /* 선수 줄 */
    names.forEach((n, pi) => {
      y += rowH;
      const arr = cards[pi] || [];
      x.fillStyle = "#F4EEDF";
      x.font = "600 27px 'IBM Plex Sans KR', sans-serif";
      x.fillText(String(n).slice(0, 6), L, y - rowH / 3);
      cx = L + nameW;
      let so = 0,
        si = 0,
        hit = 0;
      for (let i = 0; i < holes; i++) {
        const v = Number(arr[i]) || 0;
        if (v) {
          hit++;
          if (i < 9) so += v;else si += v;
        }
        const sn = golfName(v, Number(pars[i]));
        put(v || "·", cx + cellW / 2, y - rowH / 3, v ? sn.c.replace("var(--ivory)", "#F4EEDF") : "#3C5468", 30, 1);
        cx += cellW;
        if (i === 8 && holes > 9) {
          put(so || "-", cx + totW / 2, y - rowH / 3, "#F4EEDF", 30, 1);
          cx += totW;
        }
      }
      if (holes > 9) {
        put(si || "-", cx + totW / 2, y - rowH / 3, "#F4EEDF", 30, 1);
        cx += totW;
      }
      const z = golfTally(arr, pars);
      put(z.holes ? z.sum : "-", cx + totW / 2, y - rowH / 3, "#4FB286", 32, 1);
      if (z.holes) {
        x.fillStyle = "#7B93A8";
        x.textAlign = "center";
        x.font = "500 17px 'Oswald', sans-serif";
        x.fillText(fmtDiff(golfDiff(z)), cx + totW / 2, y - rowH / 3 + 20);
        x.textAlign = "left";
      }
      line(y);
    });

    /* 아래 한 줄 — 이글·버디 요약. 넘치면 글자를 줄인다 */
    const bits = names.map((n, pi) => {
      const z = golfTally(cards[pi], pars);
      if (!z.holes) return null;
      return `${String(n).slice(0, 5)} 버디 ${z.birdie} · 파 ${z.par} · 보기 ${z.bogey}`;
    }).filter(Boolean).join("      ");
    if (bits) {
      x.textAlign = "left";
      x.fillStyle = "#7B93A8";
      let fz = 21;
      const room = RW - 170;
      do {
        x.font = `500 ${fz}px 'IBM Plex Sans KR', sans-serif`;
        fz -= 1;
      } while (fz > 12 && x.measureText(bits).width > room);
      x.fillText(bits, L, H - 34);
    }
    x.fillStyle = "#5B7A91";
    x.font = "400 19px 'IBM Plex Sans KR', sans-serif";
    x.textAlign = "right";
    x.fillText("My Score", W - 40, H - 34);
    x.textAlign = "left";
  };
  if (!photo) {
    drawRest();
    return Promise.resolve(c);
  }
  return new Promise(ok => {
    const im = new Image();
    /* ★ 서버에 올린 사진은 다른 주소에서 온다.
       이걸 안 붙이면 그림은 그려지지만 [사진첩에 저장]·[복사하기] 가 막힌다 */
    if (!isDataUrl(photo)) im.crossOrigin = "anonymous";
    im.onload = () => {
      const f = photoFit(im.width, im.height, PW, H, trim);
      /* 사진이 제 칸을 넘지 않게 자른다 */
      x.save();
      x.beginPath();
      x.rect(0, 0, PW, H);
      x.clip();
      /* ★ 8판 — 줄이면 사진이 칸보다 작아진다. 남는 자리를 먼저 칠해둔다 */
      x.fillStyle = "#08121C";
      x.fillRect(0, 0, PW, H);
      x.drawImage(im, f.dx, f.dy, f.dw, f.dh);
      x.fillStyle = "rgba(11,21,32,.15)";
      x.fillRect(0, 0, PW, H);
      x.restore();
      drawRest();
      ok(c);
    };
    im.onerror = () => {
      drawRest();
      ok(c);
    };
    im.src = photo;
  });
}

/* 그림을 파일로 뽑는다 */
function cardBlob(canvas, type) {
  return new Promise(ok => {
    const q = type === "image/png" ? undefined : 0.9;
    if (canvas.toBlob) {
      canvas.toBlob(ok, type, q);
      return;
    }
    try {
      const s = canvas.toDataURL(type, q).split(",")[1];
      const bin = atob(s);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      ok(new Blob([arr], {
        type
      }));
    } catch (e) {
      ok(null);
    }
  });
}

/* ① 사진첩에 저장 */
async function saveCard(canvas, name, say) {
  const blob = await cardBlob(canvas, "image/jpeg");
  if (!blob) return say("그림을 만들지 못했습니다");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${name}.jpg`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  say("사진첩에 저장했습니다");
}

/* ② 복사 — 톡 입력창에 바로 붙여넣을 수 있다 */
async function copyCard(canvas, say) {
  try {
    const blob = await cardBlob(canvas, "image/png");
    if (!blob) throw new Error("no blob");
    await navigator.clipboard.write([new ClipboardItem({
      "image/png": blob
    })]);
    say("복사했습니다. 톡 입력창에서 붙여넣으세요");
  } catch (e) {
    say("이 브라우저는 복사를 지원하지 않습니다. [저장]을 쓰세요");
  }
}

/* ③ 바로 보내기 — 폰 공유창이 열린다 */
async function sendCard(canvas, name, say) {
  const blob = await cardBlob(canvas, "image/jpeg");
  if (!blob) return say("그림을 만들지 못했습니다");
  const file = new File([blob], `${name}.jpg`, {
    type: "image/jpeg"
  });
  try {
    if (navigator.canShare && navigator.canShare({
      files: [file]
    })) {
      await navigator.share({
        files: [file],
        title: name
      });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
  }
  return saveCard(canvas, name, say);
}

/* ── 사진 맞추기 ────────────────────────────
   그림에 들어갈 자리만큼만 보여주고, 끌어서 옮기고 늘려서 맞춘다.
   미리보기와 실제 그림이 같은 셈(photoFit)을 쓰므로 보이는 그대로 나온다.
   ══════════════════════════════════════════ */
function PhotoTrim({
  photo,
  trim,
  setTrim,
  players
}) {
  const box = useRef(null);
  const [size, setSize] = useState({
    w: 0,
    h: 0
  }); // 사진 원래 크기
  const [bw, setBw] = useState(300); // 미리보기 폭
  const drag = useRef(null);
  const H = cardH(players);
  const k = bw / CARD_PW; // 그림 좌표 → 미리보기 좌표

  useEffect(() => {
    const im = new Image();
    im.onload = () => setSize({
      w: im.width,

  if (money && (g.costs || []).length) {
